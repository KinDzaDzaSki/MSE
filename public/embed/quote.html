<!DOCTYPE html>
<html lang="mk" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MSE Berza — виџет</title>
<link rel="stylesheet" href="/widget.css?v=2" />
<script src="/logo.js?v=4"></script>
<script src="/widget.js?v=8"></script>
</head>
<body>
<div class="w-main">
  <div class="w-card" id="card">
    <div class="w-card-top">
      <span class="w-sym" id="sym">—</span>
      <span class="w-name" id="name"></span>
    </div>
    <div class="w-price-row">
      <span class="w-price" id="price">—</span>
      <span class="w-cur">MKD</span>
      <span class="w-chg" id="chg"></span>
    </div>
    <div class="w-spark"><canvas id="spark"></canvas></div>
  </div>
  <div class="w-footer" id="wFooter"></div>
</div>
<script>
W.setTheme(W.params().get('theme'));
W.footer(document.getElementById('wFooter'));
const SYM = (W.params().get('symbol') || 'KMB').toUpperCase().replace(/[^A-Z0-9]/g, '');

async function load() {
  try {
    const q = await W.fetchJSON('/api/quote/' + encodeURIComponent(SYM));
    if (q.error) throw new Error(q.error);
    document.getElementById('sym').textContent = q.symbol || SYM;
    document.getElementById('name').textContent = q.name || '';
    document.getElementById('price').textContent = W.fmt(q.lastPrice);
    const chgEl = document.getElementById('chg');
    const abs = q.dailyChange != null ? q.dailyChange : (q.changePct != null && q.lastPrice ? +(q.changePct / 100 * q.lastPrice).toFixed(2) : null);
    chgEl.textContent = (abs >= 0 ? '+' : '') + W.fmt(abs) + ' (' + W.pctStr(q.changePct) + ')';
    chgEl.className = 'w-chg ' + W.pctClass(q.changePct);
    const h = await W.fetchJSON('/api/history/' + encodeURIComponent(SYM) + '?range=1M');
    const vals = (h.rows || []).filter((r) => r.last != null).map((r) => r.last);
    const color = (q.changePct != null && q.changePct >= 0) ? '#16c784' : '#ea3943';
    W.sparkline(document.getElementById('spark'), vals.length >= 2 ? vals : [1, 1], color);
  } catch (e) {
    document.getElementById('card').innerHTML = '<div class="w-error">Нема податоци за ' + SYM + '</div>';
  }
}
load();
W.autoRefresh(load);
</script>
</body>
</html>
