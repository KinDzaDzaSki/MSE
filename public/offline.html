<!DOCTYPE html>

<head>

<style>

  .off-wrap {
    max-width: 520px; width: 100%; margin: 0 auto; padding: 64px 24px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;

  .off-logo { width: 72px; height: 72px; border-radius: 18px; }
  .off-title { font-size: 20px; font-weight: 700; color: var(--md-sys-color-on-surface); margin-top: 4px; }

  .off-btn {
    margin-top: 8px; display: inline-block; padding: 11px 20px; border-radius: 8px;
    background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    font-weight: 700; font-size: 14px; text-decoration: none;
  }
  .off-btn:hover { text-decoration: none; }
  .off-hint { font-size: 12px; color: var(--md-sys-color-on-surface-variant); opacity: 0.8; }
</style>
</head>
<body>
<main class="off-wrap">
  <img class="off-logo" src="/icon-512.png" width="72" height="72" alt="MSE Berza" />

  <p class="off-text">MSE Berza прикажува податоци во живо од Македонската берза, па за најновите котации и графици потребна е интернет врска.</p>
  <a class="off-btn" href="/">Обиди се повторно</a>
