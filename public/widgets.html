<!DOCTYPE html>
<html lang="mk" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MSE Berza — Виџети</title>
<meta name="description" content="Креирај embeddable виџети со податоци од Македонската берза: ticker лента, картичка за компанија, мини график или дивиденди." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
<!-- Preconnect for font loading -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Inter font for UI — same links as the homepage so the topbar and footer
     render in Inter, not the system fallback. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css?v=7.9" />
<!-- NOTE: widget.css is intentionally NOT loaded here — it is the embeds'
     stylesheet and sets html/body height:100% + overflow:hidden globally,
     which capped this builder page to the viewport and produced an inset
     .b-main scrollbar (plus the page scrollbar). The builder uses only
     .b-* / topbar / footer styles (styles.css + the inline block below). -->
<!-- Material Symbols (shared topbar icons; display=block — no ligature flash) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
<style>
  /* Let the page grow and scroll as one document (no viewport-capped body,
     no inner .b-main scrollbar). */
  body { height: auto; overflow: auto; }
  /* Shared topbar comes from styles.css; the footer too (.foot). */
  .b-main { flex: 1 1 auto; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; max-width: 1100px; margin: 0 auto; width: 100%; }
  .b-step h2 { font-size: 13px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); margin-bottom: 10px; }
  .b-types { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .b-type {
    position: relative;
    background: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline);
    border-radius: 10px; padding: 12px 34px 12px 14px; cursor: pointer; text-align: left;
    color: var(--md-sys-color-on-surface); font-family: inherit; transition: border-color .15s, background .15s;
  }
  .b-type:hover { border-color: var(--md-sys-color-primary); }
  .b-type.active { border-color: var(--md-sys-color-primary); background: var(--md-sys-color-surface-variant); }
  .b-type .t-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .b-type .t-desc { font-size: 11px; color: var(--md-sys-color-on-surface-variant); line-height: 1.4; }
  .b-type .t-check {
    position: absolute; top: 12px; right: 12px;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    font-size: 13px; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s;
  }
  .b-type.active .t-check { opacity: 1; transform: scale(1); }
  .b-cfg { display: flex; flex-direction: column; gap: 12px; }
  .b-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .b-field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 180px; }
  .b-field label { font-size: 12px; font-weight: 600; color: var(--md-sys-color-on-surface-variant); letter-spacing: .3px; }
  .b-field input, .b-field select {
    width: 100%;
    background: var(--md-sys-color-surface);
    border: 1px solid var(--md-sys-color-outline);
    color: var(--md-sys-color-on-surface);
    border-radius: 6px; padding: 10px 12px;
    font-family: inherit; font-size: 14px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .b-field input:focus, .b-field select:focus {
    border-color: var(--md-sys-color-primary);
    box-shadow: 0 0 0 1px var(--md-sys-color-primary);
  }
  .b-field input:hover, .b-field select:hover { border-color: var(--md-sys-color-on-surface-variant); }

  /* M3 dropdown combobox */
  .m3-cmb { position: relative; }
  .m3-cmb .m3-cmb-input {
    padding-right: 36px;
  }
  .m3-cmb-btn {
    position: absolute; right: 2px; top: 2px; bottom: 2px; width: 32px;
    background: transparent; border: none; color: var(--md-sys-color-on-surface-variant);
    cursor: pointer; font-size: 18px; border-radius: 6px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .m3-cmb-btn:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); color: var(--md-sys-color-on-surface); }
  .m3-menu {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
    background: var(--md-sys-color-surface);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    max-height: 260px; overflow-y: auto; padding: 6px;
    animation: m3MenuIn .12s ease;
  }
  @keyframes m3MenuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .m3-menu button {
    display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left;
    background: transparent; border: none; color: var(--md-sys-color-on-surface);
    font-family: inherit; font-size: 13px; padding: 9px 12px; border-radius: 6px; cursor: pointer;
  }
  .m3-menu button:hover, .m3-menu button.active { background: var(--md-sys-color-surface-variant); }
  .m3-menu .m3-sym { font-weight: 700; color: var(--md-sys-color-primary); flex-shrink: 0; }
  .m3-menu .m3-name { color: var(--md-sys-color-on-surface-variant); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m3-menu .m3-empty { padding: 10px 12px; color: var(--md-sys-color-on-surface-variant); font-size: 12px; }
  .b-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--md-sys-color-surface-variant); border: 1px solid var(--md-sys-color-outline); border-radius: 8px; }
  .b-seg button {
    background: transparent; border: none; color: var(--md-sys-color-on-surface-variant);
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 6px 16px;
    border-radius: 6px; cursor: pointer;
  }
  .b-seg button.active { background: var(--md-sys-color-surface); color: var(--md-sys-color-primary); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .b-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .b-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    background: var(--md-sys-color-surface-variant); border: 1px solid var(--md-sys-color-outline);
    border-radius: 999px; padding: 3px 10px; color: var(--md-sys-color-primary);
  }
  .b-chip button { background: none; border: none; color: var(--md-sys-color-on-surface-variant); cursor: pointer; font-size: 11px; padding: 0; font-family: inherit; }
  .b-chip button:hover { color: var(--md-sys-color-negative); }
  .b-add { display: flex; gap: 6px; }
  .b-add input { flex: 1; }
  .b-add button, .b-copy, #tickerAdd {
    background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    border: none; border-radius: 6px; padding: 8px 14px; font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  #tickerAdd { height: 44px; white-space: nowrap; }
  .b-check { display: flex; align-items: center; gap: 6px; color: var(--md-sys-color-on-surface); cursor: pointer; }
  .b-check input { accent-color: var(--md-sys-color-primary); width: 14px; height: 14px; }
  .b-preview { width: 100%; border: 1px solid var(--md-sys-color-outline); border-radius: 10px; background: var(--md-sys-color-surface); min-height: 120px; }
  #snippet {
    width: 100%; min-height: 84px; resize: vertical;
    background: var(--md-sys-color-surface-variant); border: 1px solid var(--md-sys-color-outline);
    color: var(--md-sys-color-on-surface); border-radius: 8px; padding: 10px 12px;
    font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px; line-height: 1.5;
  }
  .b-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<!-- TOPBAR — shared with the dashboard (index.html) -->
<header class="topbar">
  <a class="brand" href="/">
    <div class="brand-icon">
      <span class="material-symbols-outlined icon-fill">monitoring</span>
    </div>
    <div class="brand-text">
      <span class="brand-name">MSE Berza</span>
      <span class="brand-sub">Македонска берза во живо</span>
    </div>
  </a>
  <div class="topbar-right">
    <span class="market-status" id="marketStatus">—</span>
    <span id="mbiChip">MBI10</span>
    <span id="fxChip" title="">€ — · <span class="fx-usd">$ —</span></span>
    <button class="icon-btn" id="themeToggle" title="Toggle theme / Промени тема">
      <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
    </button>
    <button class="icon-btn" id="langToggle" title="Switch language / Промени јазик">
      <span class="material-symbols-outlined" id="langIcon">translate</span>
    </button>
  </div>
</header>

<main class="b-main">
  <h1 class="sr-only">Виџети од Македонската берза за твој сајт</h1>
  <section class="b-step">
    <h2>1. Избери тип на виџет</h2>
    <div class="b-types" id="types">
      <button type="button" class="b-type active" data-type="chart">
        <span class="t-check">✓</span>
        <div class="t-name">Преглед на симбол</div>
        <div class="t-desc">Котации + график за една или повеќе компании, со избор на период — како TradingView Symbol Overview</div>
      </button>
      <button type="button" class="b-type" data-type="ticker">
        <span class="t-check">✓</span>
        <div class="t-name">Ticker лента</div>
        <div class="t-desc">Движечка лента со повеќе тикери — идеална за header</div>
      </button>
      <button type="button" class="b-type" data-type="dividends">
        <span class="t-check">✓</span>
        <div class="t-name">Дивиденди</div>
        <div class="t-desc">Топ исплатери по принос — табела</div>
      </button>
    </div>
  </section>

  <section class="b-step">
    <h2>2. Поставки</h2>
    <div class="b-cfg">
      <div class="b-row" id="rowRange" style="display:none">
        <div class="b-field">
          <label for="rangeSel">Почетен период</label>
          <select id="rangeSel">
            <option value="1M">1 месец</option>
            <option value="3M">3 месеци</option>
            <option value="6M">6 месеци</option>
            <option value="1Y" selected>1 година</option>
            <option value="ALL">Сето време</option>
          </select>
        </div>
      </div>
      <div class="b-row" id="rowChartOpts" style="display:none">
        <div class="b-field" style="flex:0 0 auto">
          <label>Стил</label>
          <div class="b-seg" id="chartTypeSeg">
            <button type="button" data-t="area" class="active">Област</button>
            <button type="button" data-t="line">Линија</button>
          </div>
        </div>
        <div class="b-field" style="flex:0 0 auto">
          <label>Промена</label>
          <select id="changeModeSel" style="font-size:13px">
            <option value="pp">Цена и %</option>
            <option value="p">Само %</option>
          </select>
        </div>
        <div class="b-field" style="flex:1 1 auto">
          <label>Опции</label>
          <div style="display:flex;flex-direction:column;gap:6px;font-size:13px">
            <label class="b-check"><input type="checkbox" id="cbVolume" /> Прикажи волумен</label>
            <label class="b-check"><input type="checkbox" id="cbPills" checked /> Избор на период во виџетот</label>
            <label class="b-check"><input type="checkbox" id="cbOnly" /> Само график (без котации)</label>
          </div>
        </div>
      </div>
      <div class="b-row" id="rowN" style="display:none">
        <div class="b-field">
          <label for="nInput">Број на компании (топ по принос)</label>
          <input id="nInput" type="number" min="3" max="30" value="10" />
        </div>
      </div>
      <div class="b-row" id="rowSymbols" style="display:none">
        <div class="b-field" style="flex:3 1 260px">
          <label for="tickerInput">Додај тикер</label>
          <div style="display:flex;gap:8px;align-items:flex-start">
            <div class="m3-cmb" style="flex:1">
              <input id="tickerInput" class="m3-cmb-input" autocomplete="off" role="combobox" aria-expanded="false" placeholder="пр. KMB" />
              <button type="button" class="m3-cmb-btn" id="tickerMenuBtn" aria-label="Отвори листа">⌄</button>
              <div class="m3-menu" id="tickerMenu" hidden></div>
            </div>
            <button type="button" id="tickerAdd" style="padding:10px 16px">Додај</button>
          </div>
          <div class="b-chips" id="tickerChips"></div>
        </div>
      </div>
      <div class="b-row">
        <div class="b-field" style="flex:0 0 auto">
          <label>Тема</label>
          <div class="b-seg" id="themeSeg">
            <button type="button" data-t="light">Светла</button>
            <button type="button" data-t="dark" class="active">Темна</button>
          </div>
        </div>
        <div class="b-field" style="flex:0 0 120px">
          <label for="hInput">Височина (px)</label>
          <input id="hInput" type="number" min="40" max="1200" value="420" />
        </div>
        <div class="b-field" style="flex:0 0 120px">
          <label for="wInput">Ширина (px или %)</label>
          <input id="wInput" type="text" value="480" />
        </div>
      </div>
    </div>
  </section>

  <section class="b-step">
    <h2>3. Преглед</h2>
    <iframe class="b-preview" id="preview" title="Преглед на виџет" height="280"></iframe>
  </section>

  <section class="b-step">
    <h2>4. Вгради го во твојот сајт</h2>
    <textarea id="snippet" readonly></textarea>
    <div class="b-actions">
      <button type="button" class="b-copy" id="copyBtn">Копирај код</button>
    </div>
  </section>
</main>

<footer class="foot"></footer>

<script src="/logo.js?v=4"></script>
<script src="/widget.js?v=11"></script>
<script>
const DEFAULT_H = { chart: 420, ticker: 40, dividends: 380 };
const DEFAULT_W = { chart: '480', ticker: '100%', dividends: '100%' };
const state = {
  type: 'chart',
  symbolsByType: { chart: ['KMB', 'ALK', 'TEL'], ticker: [], dividends: [] },
  range: '1Y',
  n: 10,
  theme: 'dark',
  height: DEFAULT_H.chart,
  width: DEFAULT_W.chart,
  chartType: 'area',
  changeMode: 'pp',
  showVolume: false,
  chartOnly: false,
  pills: true,
};
function curSyms() {
  return state.type === 'ticker' ? state.symbolsByType.ticker
    : state.type === 'chart' ? state.symbolsByType.chart : [];
}

// Debounce timer for preview/snippet refresh.
let previewTimer = null;

// ---- widget theme: independent from the site theme ----
// The seg only sets state.theme, which is passed to the preview iframe via
// the URL (?theme=) — the iframe is its own document. The topbar theme
// toggle (W.initTopbar) changes the page theme only and is not wired back
// here, so the two themes never touch each other in either direction.
function setBuilderTheme(t) {
  state.theme = t;
  document.querySelectorAll('#themeSeg button').forEach((b) => b.classList.toggle('active', b.dataset.t === t));
  update();
}
document.querySelectorAll('#themeSeg button').forEach((b) => b.addEventListener('click', () => setBuilderTheme(b.dataset.t)));
if (typeof W !== 'undefined' && W.initTopbar) {
  W.initTopbar();
  W.renderFoot();
}

// ---- symbol list (live data) + M3 combobox ----
let SYMBOL_LIST = [];
(async () => {
  try {
    const d = await W.fetchJSON('/api/quotes');
    SYMBOL_LIST = d.quotes.filter((q) => q.primary !== false)
      .sort((a, b) => a.symbol.localeCompare(b.symbol))
      .map((q) => ({ symbol: q.symbol, name: (q.name || '').replace(/"/g, '') }));
  } catch (e) { SYMBOL_LIST = []; }
})();

// M3 dropdown combobox: input + ⌄ button + filterable menu.
function initCombobox(input, menu, onPick) {
  const btn = input.parentElement.querySelector('.m3-cmb-btn');
  let filtered = [];
  const render = () => {
    const q = input.value.trim().toUpperCase();
    // exact symbol prefixes first, then name matches (keeps TEL above FUBT for "tel")
    const starts = SYMBOL_LIST.filter((s) => s.symbol.startsWith(q));
    const names = SYMBOL_LIST.filter((s) => !s.symbol.startsWith(q) && (s.name || '').toUpperCase().includes(q));
    filtered = starts.concat(names).slice(0, 40);
    menu.innerHTML = filtered.length
      ? filtered.map((s, i) => `<button type="button" data-i="${i}"><span class="m3-sym">${s.symbol}</span><span class="m3-name">${s.name}</span></button>`).join('')
      : '<div class="m3-empty">Нема резултати</div>';
    menu.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  };
  const open = () => { if (SYMBOL_LIST.length) render(); };
  const close = () => { menu.hidden = true; input.setAttribute('aria-expanded', 'false'); };
  input.addEventListener('focus', open);
  input.addEventListener('input', open);
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    const s = filtered[+b.dataset.i];
    if (s) { input.value = s.symbol; onPick(s.symbol); }
    close(); input.focus();
  });
  btn.addEventListener('click', () => (menu.hidden ? open() : close()));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (menu.hidden) open(); else { const cur = menu.querySelector('button.active'); const next = cur ? cur.nextElementSibling : menu.querySelector('button'); if (next && next.tagName === 'BUTTON') { menu.querySelectorAll('button').forEach(b => b.classList.remove('active')); next.classList.add('active'); next.scrollIntoView({ block: 'nearest' }); } } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); const cur = menu.querySelector('button.active'); const prev = cur ? cur.previousElementSibling : null; if (prev && prev.tagName === 'BUTTON') { menu.querySelectorAll('button').forEach(b => b.classList.remove('active')); prev.classList.add('active'); prev.scrollIntoView({ block: 'nearest' }); } }
    else if (e.key === 'Enter') { const act = menu.querySelector('button.active'); if (!menu.hidden && act) { act.click(); e.preventDefault(); } }
    else if (e.key === 'Escape') { close(); }
  });
  document.addEventListener('click', (e) => { if (!input.closest('.m3-cmb').contains(e.target)) close(); });
}

initCombobox(
  document.getElementById('tickerInput'),
  document.getElementById('tickerMenu'),
  () => addTicker()
);

// ---- type switching ----
const CFG_ROWS = {
  chart: ['rowSymbols', 'rowRange', 'rowChartOpts'],
  ticker: ['rowSymbols'],
  dividends: ['rowN'],
};
function applyCfgRows() {
  CFG_ROWS[state.type].forEach((id) => { document.getElementById(id).style.display = ''; });
  // rowSymbols is shared by chart + ticker — visible for both; everything
  // else outside the active type is hidden. Runs once at init too (the
  // default type is already active in markup, so first load shows chart rows).
  Object.keys(CFG_ROWS).forEach((t) => CFG_ROWS[t].forEach((id) => { document.getElementById(id).style.display = (t === state.type) ? '' : 'none'; }));
  document.getElementById('rowSymbols').style.display = (state.type === 'chart' || state.type === 'ticker') ? '' : 'none';
}
document.querySelectorAll('.b-type').forEach((b) => b.addEventListener('click', () => {
  state.type = b.dataset.type;
  document.querySelectorAll('.b-type').forEach((x) => x.classList.toggle('active', x === b));
  applyCfgRows();
  state.height = DEFAULT_H[state.type];
  state.width = DEFAULT_W[state.type];
  document.getElementById('hInput').value = state.height;
  document.getElementById('wInput').value = state.width;
  renderTickerChips();
  update();
}));
applyCfgRows();

// ---- multi-symbol chips (ticker + symbol overview) ----
function renderTickerChips() {
  const syms = curSyms();
  document.getElementById('tickerChips').innerHTML = syms.length
    ? syms.map((s) => `<span class="b-chip">${s}<button type="button" data-rm="${s}" title="Отстрани">✕</button></span>`).join('')
    : '<span style="font-size:12px;color:var(--md-sys-color-on-surface-variant)">Нема додадени тикери</span>';
  document.querySelectorAll('#tickerChips [data-rm]').forEach((b) => b.addEventListener('click', () => {
    state.symbolsByType[state.type === 'ticker' ? 'ticker' : 'chart'] =
      curSyms().filter((s) => s !== b.dataset.rm);
    renderTickerChips(); update();
  }));
}
document.getElementById('tickerAdd').addEventListener('click', addTicker);
document.getElementById('tickerInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addTicker(); } });
function addTicker() {
  const inp = document.getElementById('tickerInput');
  const s = inp.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  const list = curSyms();
  if (s && !list.includes(s) && list.length < 20) list.push(s);
  inp.value = '';
  renderTickerChips(); update();
}

// ---- chart opts ----
document.querySelectorAll('#chartTypeSeg button').forEach((b) => b.addEventListener('click', () => {
  state.chartType = b.dataset.t;
  document.querySelectorAll('#chartTypeSeg button').forEach((x) => x.classList.toggle('active', x === b));
  update();
}));
document.getElementById('changeModeSel').addEventListener('change', (e) => { state.changeMode = e.target.value; update(); });
document.getElementById('cbVolume').addEventListener('change', (e) => { state.showVolume = e.target.checked; update(); });
document.getElementById('cbOnly').addEventListener('change', (e) => { state.chartOnly = e.target.checked; update(); });
document.getElementById('cbPills').addEventListener('change', (e) => { state.pills = e.target.checked; update(); });

// ---- inputs ----
document.getElementById('rangeSel').addEventListener('change', (e) => { state.range = e.target.value; update(); });
document.getElementById('nInput').addEventListener('input', (e) => { state.n = Math.min(30, Math.max(3, parseInt(e.target.value, 10) || 10)); update(); });
document.getElementById('hInput').addEventListener('input', (e) => { state.height = Math.min(1200, Math.max(40, parseInt(e.target.value, 10) || DEFAULT_H[state.type])); update(); });
document.getElementById('wInput').addEventListener('input', (e) => { state.width = e.target.value.trim() || DEFAULT_W[state.type]; update(); });

// ---- URL + snippet ----
function embedURL() {
  const p = new URLSearchParams();
  p.set('theme', state.theme);
  if (state.type === 'chart') {
    p.set('symbols', curSyms().join(','));
    p.set('range', state.range);
    p.set('chartType', state.chartType);
    p.set('showVolume', state.showVolume ? '1' : '0');
    p.set('chartOnly', state.chartOnly ? '1' : '0');
    p.set('dateRanges', state.pills ? '1' : '0');
    p.set('changeMode', state.changeMode);
  }
  if (state.type === 'ticker') p.set('symbols', curSyms().join(','));
  if (state.type === 'dividends') p.set('n', state.n);
  return `${location.origin}/embed/${state.type}.html?${p.toString()}`;
}
function snippet() {
  const h = encodeURIComponent(state.height).replace(/%20/g, '') || state.height;
  const w = state.width;
  return `<iframe src="${embedURL()}" width="${w}" height="${state.height}" style="border:0;border-radius:8px" title="MSE Berza — виџет" loading="lazy"></iframe>`;
}

function update() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    const url = embedURL();
    const f = document.getElementById('preview');
    f.height = state.height; // preview should mirror the real embed height
    if (f.src !== url) f.src = url;
    document.getElementById('snippet').value = snippet();
  }, 400);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const ta = document.getElementById('snippet');
  try {
    await navigator.clipboard.writeText(ta.value);
  } catch (_) {
    ta.select(); document.execCommand('copy');
  }
  const btn = document.getElementById('copyBtn');
  btn.textContent = 'Копирано ✓';
  setTimeout(() => { btn.textContent = 'Копирај код'; }, 1500);
});

// ---- init: default ticker symbols = liquid top ----
(async () => {
  try {
    const d = await W.fetchJSON('/api/quotes');
    const liq = d.quotes.filter((q) => q.liq && q.primary !== false)
      .sort((a, b) => (b.value || 0) - (a.value || 0)).slice(0, 12).map((q) => q.symbol);
    if (liq.length) state.symbolsByType.ticker = liq;
  } catch (e) { state.symbolsByType.ticker = ['KMB', 'ALK', 'TEL']; }
  renderTickerChips();
  update();
})();
update();
</script>
